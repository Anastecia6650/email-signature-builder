<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta name="description" content="Professional email signature builder with shareable client pages.">
<title>Email Signature Builder</title>

<style>
*{box-sizing:border-box}

:root{
  --bg:#f4f6f8;
  --card:#fff;
  --text:#101828;
  --muted:#667085;
  --border:#dfe3e8;
  --primary:#111827;
  --primary-hover:#27303f;
  --success:#067647;
  --danger:#b42318;
}

html,body{
  margin:0;
  padding:0;
  min-height:100%;
}

body{
  background:var(--bg);
  color:var(--text);
  font-family:Arial,Helvetica,sans-serif;
}

button,input,textarea,select{
  font:inherit;
}

button{
  cursor:pointer;
}

img{
  max-width:100%;
}

.app{
  min-height:100vh;
}

.topbar{
  position:sticky;
  top:0;
  z-index:50;
  background:#fff;
  border-bottom:1px solid var(--border);
  padding:15px 24px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:20px;
}

.brand{
  display:flex;
  align-items:center;
  gap:11px;
}

.brand-icon{
  width:40px;
  height:40px;
  border-radius:10px;
  display:flex;
  align-items:center;
  justify-content:center;
  background:#111827;
  color:#fff;
  font-weight:800;
}

.brand-title{
  font-weight:800;
  font-size:16px;
}

.brand-subtitle{
  font-size:11px;
  color:var(--muted);
  margin-top:2px;
}

.actions{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
}

.btn{
  border:0;
  border-radius:8px;
  padding:10px 14px;
  font-weight:700;
  font-size:13px;
}

.btn-primary{
  background:var(--primary);
  color:#fff;
}

.btn-primary:hover{
  background:var(--primary-hover);
}

.btn-secondary{
  background:#fff;
  color:#344054;
  border:1px solid #d0d5dd;
}

.btn-success{
  background:var(--success);
  color:#fff;
}

.btn-danger{
  background:#fee4e2;
  color:var(--danger);
}

.container{
  width:min(1450px,100%);
  margin:auto;
  padding:25px;
}

.builder-grid{
  display:grid;
  grid-template-columns:420px minmax(0,1fr);
  gap:22px;
  align-items:start;
}

.card{
  background:var(--card);
  border:1px solid var(--border);
  border-radius:15px;
  box-shadow:0 3px 16px rgba(16,24,40,.04);
}

.builder-card{
  position:sticky;
  top:80px;
  max-height:calc(100vh - 100px);
  overflow-y:auto;
}

.card-inner{
  padding:20px;
}

.section{
  margin-bottom:25px;
}

.section:last-child{
  margin-bottom:0;
}

.section-title{
  font-size:12px;
  font-weight:800;
  letter-spacing:.06em;
  text-transform:uppercase;
  margin-bottom:13px;
  color:#344054;
}

.field{
  margin-bottom:11px;
}

.field:last-child{
  margin-bottom:0;
}

label{
  display:block;
  font-size:12px;
  font-weight:700;
  margin-bottom:5px;
  color:#344054;
}

input,
textarea,
select{
  width:100%;
  padding:10px 11px;
  border:1px solid #d0d5dd;
  border-radius:8px;
  background:#fff;
  color:#101828;
  outline:none;
}

input:focus,
textarea:focus,
select:focus{
  border-color:#667085;
  box-shadow:0 0 0 3px rgba(17,24,39,.06);
}

textarea{
  min-height:75px;
  resize:vertical;
}

.two{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:9px;
}

.layout-tabs{
  display:grid;
  grid-template-columns:repeat(5,1fr);
  gap:6px;
}

.layout-tab{
  padding:9px 4px;
  border:1px solid #d0d5dd;
  background:#fff;
  color:#344054;
  border-radius:7px;
  font-size:11px;
  font-weight:700;
}

.layout-tab.active{
  background:#111827;
  border-color:#111827;
  color:#fff;
}

.social-item{
  display:grid;
  grid-template-columns:100px minmax(0,1fr) 34px;
  gap:6px;
  margin-bottom:7px;
}

.social-item button{
  padding:0;
}

.add-social{
  margin-top:3px;
}

.notice{
  background:#f2f4f7;
  border-radius:8px;
  padding:11px;
  color:#475467;
  font-size:11px;
  line-height:1.55;
}

.small-text{
  color:var(--muted);
  font-size:10px;
  line-height:1.5;
}

.client-box{
  display:none;
  margin-top:12px;
}

.client-box.visible{
  display:block;
}

.client-link{
  font-size:11px;
}

.status{
  min-height:17px;
  margin-top:6px;
  font-size:11px;
}

.status.success{
  color:var(--success);
}

.status.error{
  color:var(--danger);
}

.preview-card{
  min-width:0;
}

.preview-header{
  padding:16px 20px;
  border-bottom:1px solid var(--border);
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
}

.preview-header h2{
  margin:0;
  font-size:16px;
}

.preview-area{
  padding:40px;
  min-height:500px;
  background:#f8f9fa;
  overflow:auto;
  -webkit-overflow-scrolling:touch;
}

.signature-paper{
  background:#fff;
  border:1px solid #e4e7ec;
  border-radius:9px;
  padding:35px;
  min-width:500px;
  width:max-content;
  max-width:none;
  box-shadow:0 8px 25px rgba(16,24,40,.05);
}

.signature-empty{
  width:100%;
  min-width:0;
  text-align:center;
  padding:70px 25px;
  color:#667085;
}

.signature-empty strong{
  display:block;
  color:#344054;
  font-size:14px;
  margin-bottom:5px;
}

.instructions{
  margin-top:20px;
}

.instruction{
  border:1px solid var(--border);
  border-radius:10px;
  padding:14px;
  margin-bottom:9px;
}

.instruction:last-child{
  margin-bottom:0;
}

.instruction h3{
  margin:0 0 5px;
  font-size:13px;
}

.instruction p{
  margin:0;
  color:var(--muted);
  font-size:11px;
  line-height:1.55;
}

.modal{
  display:none;
  position:fixed;
  inset:0;
  z-index:100;
  background:rgba(16,24,40,.6);
  padding:20px;
  align-items:center;
  justify-content:center;
}

.modal.open{
  display:flex;
}

.modal-content{
  width:min(900px,100%);
  max-height:90vh;
  background:#fff;
  border-radius:14px;
  padding:20px;
  overflow:auto;
}

.modal-header{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-bottom:12px;
}

.modal-header h2{
  margin:0;
  font-size:17px;
}

.code-output{
  width:100%;
  min-height:380px;
  font-family:monospace;
  font-size:11px;
}

.client-page{
  min-height:100vh;
  background:#f4f6f8;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:25px;
}

.client-container{
  width:min(780px,100%);
  background:#fff;
  border:1px solid #dfe3e8;
  border-radius:18px;
  padding:30px;
  box-shadow:0 12px 45px rgba(16,24,40,.08);
}

.client-heading{
  margin-bottom:22px;
}

.client-heading h1{
  margin:0;
  font-size:23px;
}

.client-heading p{
  margin:7px 0 0;
  color:#667085;
  font-size:13px;
  line-height:1.5;
}

.client-signature{
  background:#fff;
  border:1px solid #e4e7ec;
  border-radius:10px;
  padding:28px;
  overflow:auto;
  -webkit-overflow-scrolling:touch;
}

.client-buttons{
  display:flex;
  flex-wrap:wrap;
  gap:8px;
  margin-top:18px;
}

.client-instructions{
  border-top:1px solid #e4e7ec;
  margin-top:25px;
  padding-top:22px;
}

.client-instructions h3{
  font-size:14px;
  margin:0 0 5px;
}

.client-instructions p{
  color:#667085;
  font-size:11px;
  line-height:1.6;
  margin:0 0 17px;
}

.client-message{
  min-height:18px;
  font-size:11px;
  margin-top:7px;
  color:#067647;
}

.invalid-page{
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
  background:#f4f6f8;
}

.invalid-card{
  width:min(480px,100%);
  background:#fff;
  border:1px solid #dfe3e8;
  border-radius:16px;
  padding:30px;
  text-align:center;
}

.invalid-card h1{
  margin:0 0 8px;
  font-size:21px;
}

.invalid-card p{
  color:#667085;
  font-size:13px;
  line-height:1.6;
  margin:0;
}

.hidden{
  display:none!important;
}

@media(max-width:1000px){
  .builder-grid{
    grid-template-columns:1fr;
  }

  .builder-card{
    position:relative;
    top:auto;
    max-height:none;
  }
}

@media(max-width:650px){
  .topbar{
    padding:12px 15px;
    align-items:flex-start;
    flex-direction:column;
  }

  .actions{
    width:100%;
  }

  .actions .btn{
    flex:1 1 auto;
  }

  .container{
    padding:12px;
  }

  .card-inner{
    padding:15px;
  }

  .two{
    grid-template-columns:1fr;
  }

  .layout-tabs{
    grid-template-columns:repeat(3,1fr);
  }

  .preview-area{
    padding:10px;
  }

  .signature-paper{
    min-width:500px;
    padding:20px;
  }

  .client-page{
    padding:10px;
    align-items:flex-start;
  }

  .client-container{
    padding:20px;
    margin:10px 0;
  }

  .client-signature{
    padding:18px;
  }
}
</style>
</head>

<body>
<div id="app"></div>

<script>
"use strict";

/* ============================================================
   APPLICATION STATE
============================================================ */

let currentLayout = 1;
let uploadedLogoData = "";

let socials = [
  {type:"LinkedIn",url:""},
  {type:"Instagram",url:""},
  {type:"Facebook",url:""},
  {type:"X",url:""}
];

/* ============================================================
   BASIC HELPERS
============================================================ */

function $(id){
  return document.getElementById(id);
}

function escapeHTML(value){
  return String(value ?? "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#39;");
}

function escapeAttribute(value){
  return escapeHTML(value);
}

function isSafeHttpUrl(value){
  try{
    const url = new URL(String(value || "").trim());
    return url.protocol === "http:" || url.protocol === "https:";
  }catch(e){
    return false;
  }
}

function normalizeUrl(value){
  const raw = String(value || "").trim();

  if(!raw){
    return "";
  }

  if(/^javascript:/i.test(raw) ||
     /^data:/i.test(raw) ||
     /^vbscript:/i.test(raw) ||
     /^file:/i.test(raw)){
    return "";
  }

  let candidate = raw;

  if(!/^https?:\/\//i.test(candidate)){
    candidate = "https://" + candidate;
  }

  return isSafeHttpUrl(candidate) ? candidate : "";
}

function safeMailUrl(value){
  const email = String(value || "").trim();

  if(!email){
    return "";
  }

  /* Basic email validation */
  if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)){
    return "";
  }

  return "mailto:" + encodeURIComponent(email);
}

function safeTelUrl(value){
  const raw = String(value || "").trim();

  if(!raw){
    return "";
  }

  const clean = raw.replace(/[^\d+().\-\s]/g,"");

  if(!clean || !/\d/.test(clean)){
    return "";
  }

  return "tel:" + clean.replace(/\s+/g,"");
}

function safeWhatsAppUrl(value){
  const raw = String(value || "").trim();

  if(!raw){
    return "";
  }

  let number = raw.replace(/[^\d]/g,"");

  if(!number){
    return "";
  }

  /*
    WhatsApp wa.me expects an international number.
    We intentionally do not guess a country code.
  */
  return "https://wa.me/" + number;
}

function externalLinkAttrs(){
  return 'target="_blank" rel="noopener noreferrer"';
}

function encodeBase64Unicode(value){
  try{
    return btoa(unescape(encodeURIComponent(value)));
  }catch(e){
    return "";
  }
}

function decodeBase64Unicode(value){
  try{
    return decodeURIComponent(escape(atob(value)));
  }catch(e){
    return "";
  }
}

/* ============================================================
   GET BUILDER DATA
============================================================ */

function getBuilderData(){

  return {
    firstName:$("firstName")?.value.trim() || "",
    lastName:$("lastName")?.value.trim() || "",
    jobTitle:$("jobTitle")?.value.trim() || "",
    company:$("company")?.value.trim() || "",
    department:$("department")?.value.trim() || "",

    email:$("email")?.value.trim() || "",
    phone:$("phone")?.value.trim() || "",
    mobile:$("mobile")?.value.trim() || "",
    website:$("website")?.value.trim() || "",
    address:$("address")?.value.trim() || "",

    logoUrl:$("logoUrl")?.value.trim() || "",
    uploadedLogo:uploadedLogoData || "",

    mainDivider:$("mainDivider")?.value || "none",
    socialDivider:$("socialDivider")?.value || "none",

    layout:currentLayout,

    socials:socials
      .filter(item => item.url.trim())
      .map(item => ({
        type:item.type,
        url:item.url.trim()
      }))
  };
}

/* ============================================================
   LOGO HANDLING
============================================================ */

function getLogoSource(data){

  if(data.uploadedLogo){
    return data.uploadedLogo;
  }

  if(data.logoUrl){
    return normalizeUrl(data.logoUrl);
  }

  return "";
}

function logoHTML(data,style){

  const src = getLogoSource(data);

  if(!src){
    return "";
  }

  return `
    <img
      src="${escapeAttribute(src)}"
      alt="${escapeAttribute(data.company || "Company logo")}"
      style="${style || "display:block;max-width:130px;max-height:80px;object-fit:contain;border:0;"}"
    >
  `;
}

/* ============================================================
   DIVIDER
============================================================ */

function divider(type){

  if(type !== "line"){
    return "";
  }

  return `
    <tr>
      <td colspan="2" style="padding:10px 0;">
        <div style="
          height:1px;
          background:#d0d5dd;
          font-size:1px;
          line-height:1px;
        ">&nbsp;</div>
      </td>
    </tr>
  `;
}

/* ============================================================
   CONTACT ICONS
============================================================ */

const contactIcons = {

  email: `
    <svg xmlns="http://www.w3.org/2000/svg"
      width="16" height="16" viewBox="0 0 24 24"
      fill="none" stroke="currentColor"
      stroke-width="2" stroke-linecap="round"
      stroke-linejoin="round">
      <rect x="3" y="5" width="18" height="14" rx="2"/>
      <polyline points="3,7 12,13 21,7"/>
    </svg>
  `,

  phone: `
    <svg xmlns="http://www.w3.org/2000/svg"
      width="16" height="16" viewBox="0 0 24 24"
      fill="none" stroke="currentColor"
      stroke-width="2" stroke-linecap="round"
      stroke-linejoin="round">
      <path d="M22 16.92v3a2 2 0 0 1-2.18 2
      A19.79 19.79 0 0 1 3.08 5.18
      A2 2 0 0 1 5.06 3h3
      a2 2 0 0 1 2 1.72
      c.12.9.33 1.78.62 2.63
      a2 2 0 0 1-.45 2.11L9 10.73
      a16 16 0 0 0 4.27 4.27l1.27-1.23
      a2 2 0 0 1 2.11-.45
      c.85.29 1.73.5 2.63.62
      A2 2 0 0 1 22 16.92z"/>
    </svg>
  `,

  mobile: `
    <svg xmlns="http://www.w3.org/2000/svg"
      width="16" height="16" viewBox="0 0 24 24"
      fill="none" stroke="currentColor"
      stroke-width="2" stroke-linecap="round"
      stroke-linejoin="round">
      <rect x="5" y="2" width="14" height="20" rx="2"/>
      <line x1="12" y1="18" x2="12.01" y2="18"/>
    </svg>
  `,

  website: `
    <svg xmlns="http://www.w3.org/2000/svg"
      width="16" height="16" viewBox="0 0 24 24"
      fill="none" stroke="currentColor"
      stroke-width="2" stroke-linecap="round"
      stroke-linejoin="round">
      <circle cx="12" cy="12" r="10"/>
      <line x1="2" y1="12" x2="22" y2="12"/>
      <path d="M12 2a15.3 15.3 0 0 1 0 20"/>
      <path d="M12 2a15.3 15.3 0 0 0 0 20"/>
    </svg>
  `
};

/* ============================================================
   CONTACT HTML
============================================================ */

function contactHTML(data){

  let html = "";

  const iconBox = `
    display:inline-flex;
    align-items:center;
    justify-content:center;
    width:30px;
    height:30px;
    border:1px solid #d0d5dd;
    border-radius:6px;
    color:#344054;
    vertical-align:middle;
  `;

  if(data.email){
    const href = safeMailUrl(data.email);

    if(href){
      html += `
        <tr>
          <td style="padding:3px 7px 3px 0;">
            <a
              href="${escapeAttribute(href)}"
              title="${escapeAttribute(data.email)}"
              style="text-decoration:none;color:#344054;"
            >
              <span style="${iconBox}">
                ${contactIcons.email}
              </span>
            </a>
          </td>
          <td style="
            font-family:Arial,Helvetica,sans-serif;
            font-size:12px;
            color:#475467;
            padding:3px 0;
          ">
            <a
              href="${escapeAttribute(href)}"
              style="color:#475467;text-decoration:none;"
            >${escapeHTML(data.email)}</a>
          </td>
        </tr>
      `;
    }
  }

  if(data.phone){
    const href = safeTelUrl(data.phone);

    if(href){
      html += `
        <tr>
          <td style="padding:3px 7px 3px 0;">
            <a
              href="${escapeAttribute(href)}"
              title="${escapeAttribute(data.phone)}"
              style="text-decoration:none;color:#344054;"
            >
              <span style="${iconBox}">
                ${contactIcons.phone}
              </span>
            </a>
          </td>
          <td style="
            font-family:Arial,Helvetica,sans-serif;
            font-size:12px;
            color:#475467;
            padding:3px 0;
          ">
            <a
              href="${escapeAttribute(href)}"
              style="color:#475467;text-decoration:none;"
            >${escapeHTML(data.phone)}</a>
          </td>
        </tr>
      `;
    }
  }

  if(data.mobile){
    const href = safeTelUrl(data.mobile);

    if(href){
      html += `
        <tr>
          <td style="padding:3px 7px 3px 0;">
            <a
              href="${escapeAttribute(href)}"
              title="${escapeAttribute(data.mobile)}"
              style="text-decoration:none;color:#344054;"
            >
              <span style="${iconBox}">
                ${contactIcons.mobile}
              </span>
            </a>
          </td>
          <td style="
            font-family:Arial,Helvetica,sans-serif;
            font-size:12px;
            color:#475467;
            padding:3px 0;
          ">
            <a
              href="${escapeAttribute(href)}"
              style="color:#475467;text-decoration:none;"
            >${escapeHTML(data.mobile)}</a>
          </td>
        </tr>
      `;
    }
  }

  if(data.website){
    const href = normalizeUrl(data.website);

    if(href){
      html += `
        <tr>
          <td style="padding:3px 7px 3px 0;">
            <a
              href="${escapeAttribute(href)}"
              ${externalLinkAttrs()}
              title="${escapeAttribute(data.website)}"
              style="text-decoration:none;color:#344054;"
            >
              <span style="${iconBox}">
                ${contactIcons.website}
              </span>
            </a>
          </td>
          <td style="
            font-family:Arial,Helvetica,sans-serif;
            font-size:12px;
            color:#475467;
            padding:3px 0;
          ">
            <a
              href="${escapeAttribute(href)}"
              ${externalLinkAttrs()}
              style="color:#475467;text-decoration:none;"
            >${escapeHTML(data.website)}</a>
          </td>
        </tr>
      `;
    }
  }

  if(data.address){
    html += `
      <tr>
        <td colspan="2" style="
          font-family:Arial,Helvetica,sans-serif;
          font-size:13px;
          color:#667085;
          padding:5px 0;
          line-height:1.45;
        ">
          ${escapeHTML(data.address).replace(/\n/g,"<br>")}
        </td>
      </tr>
    `;
  }

  return html;
}

/* ============================================================
   SOCIAL ICONS
============================================================ */

const socialIcons = {

  LinkedIn: `
    <svg xmlns="http://www.w3.org/2000/svg"
      width="17" height="17" viewBox="0 0 24 24"
      fill="currentColor">
      <path d="M20.45 20.45h-3.56v-5.58
      c0-1.33-.03-3.04-1.85-3.04
      -1.85 0-2.13 1.45-2.13 2.95v5.67H9.35V8.98h3.42v1.56h.05
      c.48-.9 1.64-1.85 3.37-1.85
      3.61 0 4.28 2.37 4.28 5.46v6.3zM5.34 7.43
      a2.07 2.07 0 1 1 0-4.14
      2.07 2.07 0 0 1 0 4.14zM3.56 8.98h3.56v11.47H3.56V8.98z"/>
    </svg>
  `,

  Instagram: `

============================================================ */

function getSocialUrl(item){

  const raw = String(item.url || "").trim();

  if(!raw){
    return "";
  }

  if(item.type === "WhatsApp"){
    return safeWhatsAppUrl(raw);
  }

  return normalizeUrl(raw);
}

  const validSocials = data.socials

    data.firstName ||
    data.lastName ||
    data.jobTitle ||
    data.company ||
    data.department ||
    data.email ||
    data.phone ||
    data.mobile ||
    data.website ||
    data.address ||
    data.logoUrl ||
    data.uploadedLogo ||
    data.socials.length
  );
}

function renderPreview(){

  const data = getBuilderData();
  const preview = $("signaturePreview");

  if(!preview){

  if(isSignatureEmpty(data)){
    preview.innerHTML = `
      <div class="signature-empty">
        <strong>Your signature preview will appear here</strong>
        Start by entering your name, job title, company, or contact details.
      </div>

    return;

  preview.innerHTML = generateSignature(data);
}

/* ============================================================
   LOCAL STORAGE
============================================================ */

const STORAGE_KEY = "emailSignatureBuilderDraftV2";

function saveDraft(){

  try{
    const data = getBuilderData();

    localStorage.setItem(
      STORAGE_KEY,
      JSON.stringify(data)
    );
  }catch(e){
    /* Storage may be unavailable in private browsing. */
  }
}

function loadDraft(){

  try{

    const raw = localStorage.getItem(STORAGE_KEY);

    if(!raw){
      return false;
    }

    const data = JSON.parse(raw);

    if(!data || typeof data !== "object"){
      return false;
    }

    currentLayout = Number(data.layout) || 1;

    const fields = [
      "firstName",
      "lastName",
      "jobTitle",
      "company",
      "department",
      "email",
      "phone",
      "mobile",
      "website",
      "address",
      "logoUrl",
      "mainDivider",
      "socialDivider"
    ];

    fields.forEach(id => {
      if($(id) && typeof data[id] === "string"){
        $(id).value = data[id];
      }
    });

    uploadedLogoData =
      typeof data.uploadedLogo === "string"
        ? data.uploadedLogo
        : "";

    if(Array.isArray(data.socials)){
      socials = data.socials
        .filter(item =>
          item &&
          typeof item.type === "string" &&
          typeof item.url === "string"
        )
        .map(item => ({
          type:item.type,
          url:item.url
        }));
    }

    return true;

  }catch(e){
    return false;
  }
}

let statusTimer = null;

  clearTimeout(statusTimer);

  status.textContent = message;

  statusTimer = setTimeout(() => {

  },4000);
}

/* ============================================================
   COPY HELPER
============================================================ */

async function copyText(text){

  if(!text){
    return false;
  }

  if(
    navigator.clipboard &&
    window.isSecureContext &&
    typeof navigator.clipboard.writeText === "function"
  ){

    try{
      await navigator.clipboard.writeText(text);
      return true;
    }catch(e){
      /* Continue to fallback. */
    }
  }

  try{

    const textarea = document.createElement("textarea");

    textarea.value = text;
    textarea.setAttribute("readonly","");
    textarea.style.position = "fixed";
    textarea.style.left = "-9999px";
    textarea.style.top = "0";
    textarea.style.opacity = "0";

    document.body.appendChild(textarea);

    textarea.focus();
    textarea.select();
    textarea.setSelectionRange(0,textarea.value.length);

    const successful =
      document.execCommand("copy");

    textarea.remove();

    return successful;

  }catch(e){
    return false;
  }
}

   COPY SIGNATURE HTML
============================================================ */

async function copySignature(){

  const data = getBuilderData();
  const html = generateSignature(data);

  if(isSignatureEmpty(data)){
    showStatus("Add some information before copying your signature.","error");
    return;
  }

  const success = await copyText(html);

  if(success){
    showStatus("Signature HTML copied to clipboard.","success");
  }else{
    openHTMLModal(html);
  }
}

/* ============================================================
   HTML MODAL
============================================================ */

function openHTMLModal(html){

  const modal = $("htmlModal");
  const output = $("htmlOutput");

  if(!modal || !output){
    return;
  }

  output.value = html;
  modal.classList.add("open");
  modal.setAttribute("aria-hidden","false");

  setTimeout(() => {
    output.focus();
    output.select();
  },50);
}

function closeHTMLModal(){

  const modal = $("htmlModal");

  if(!modal){
    return;
  }

  modal.classList.remove("open");
  modal.setAttribute("aria-hidden","true");
}

async function copyModalHTML(){

  const output = $("htmlOutput");

  if(!output){
    return;
  }

  const success = await copyText(output.value);

  if(success){
    showStatus("HTML copied to clipboard.","success");
    closeHTMLModal();
  }else{
    showStatus(
      "Copy failed. Select the HTML manually and copy it.",
      "error"
    );
  }
}

/* ============================================================
   CLIENT LINK
============================================================ */

function buildClientUrl(){

  const data = getBuilderData();

  /*
    We store the complete signature data in the URL.
    This keeps the client page independent of localStorage.
  */

  const cleanData = {
    firstName:data.firstName,
    lastName:data.lastName,
    jobTitle:data.jobTitle,
    company:data.company,
    department:data.department,
    email:data.email,
    phone:data.phone,
    mobile:data.mobile,
    website:data.website,
    address:data.address,
    logoUrl:data.logoUrl,
    uploadedLogo:data.uploadedLogo,
    mainDivider:data.mainDivider,
    socialDivider:data.socialDivider,
    layout:data.layout,
    socials:data.socials
  };

  const encoded =
    encodeBase64Unicode(JSON.stringify(cleanData));

  if(!encoded){
    return "";
  }

  const base =
    window.location.href.split("#")[0];

  return base + "#client=" +
    encodeURIComponent(encoded);
}

async function createClientLink(){

  const data = getBuilderData();

  if(isSignatureEmpty(data)){
    showStatus(
      "Add signature information before creating a client link.",
      "error"
    );
    return;
  }

  const url = buildClientUrl();

  if(!url){
    showStatus(
      "Unable to create the client link.",
      "error"
    );
    return;
  }

  const box = $("clientBox");
  const input = $("clientLink");

  if(box){
    box.classList.add("visible");
  }

  if(input){
    input.value = url;
  }

  const copied = await copyText(url);

  showStatus(
    copied
      ? "Client link created and copied."
      : "Client link created. Copy it from the field below.",
    "success"
  );
}

/* ============================================================
   READ CLIENT DATA
============================================================ */

function getClientDataFromHash(){

  const hash = window.location.hash || "";

  if(!hash.startsWith("#client=")){
    return null;
  }

  try{

    const encoded =
      decodeURIComponent(hash.substring(8));

    const json =
      decodeBase64Unicode(encoded);

    if(!json){
      return null;
    }

    const data = JSON.parse(json);

    if(!data || typeof data !== "object"){
      return null;
    }

    data.layout = Number(data.layout) || 1;

    data.socials =
      Array.isArray(data.socials)
        ? data.socials.filter(item =>
            item &&
            typeof item.type === "string" &&
            typeof item.url === "string"
          )
        : [];

    data.firstName =
      String(data.firstName || "");

    data.lastName =
      String(data.lastName || "");

    data.jobTitle =
      String(data.jobTitle || "");

    data.company =
      String(data.company || "");

    data.department =
      String(data.department || "");

    data.email =
      String(data.email || "");

    data.phone =
      String(data.phone || "");

    data.mobile =
      String(data.mobile || "");

    data.website =
      String(data.website || "");

    data.address =
      String(data.address || "");

    data.logoUrl =
      String(data.logoUrl || "");

    data.uploadedLogo =
      String(data.uploadedLogo || "");

    data.mainDivider =
      data.mainDivider === "line"
        ? "line"
        : "none";

    data.socialDivider =
      data.socialDivider === "line"
        ? "line"
        : "none";

    return data;

  }catch(e){
    return null;
  }
}

/* ============================================================

function updateLayoutButtons(){

  document
    .querySelectorAll("[data-layout]")
    .forEach(button => {

      const layout =
        Number(button.dataset.layout);

      button.classList.toggle(
        "active",
        layout === currentLayout
      );
    });
}

function setLayout(layout){

  const value = Number(layout);

  if(value < 1 || value > 5){
    return;
  }

  currentLayout = value;

  updateLayoutButtons();
  renderPreview();
  saveDraft();
}

/* ============================================================
   LOGO UPLOAD
============================================================ */

function handleLogoUpload(event){

  const file =
    event.target.files?.[0];

  if(!file){
    return;
  }

  if(!file.type.startsWith("image/")){
    showStatus(
      "Please select a valid image file.",
      "error"
    );
    event.target.value = "";
    return;
  }

  /*
    Avoid excessively large data URLs.
    2.5 MB is deliberately conservative for shareable URLs.
  */
  if(file.size > 2.5 * 1024 * 1024){
    showStatus(
      "Please use a logo smaller than 2.5 MB.",
      "error"
    );
    event.target.value = "";
    return;
  }

  const reader = new FileReader();

  reader.onload = function(){

    if(typeof reader.result !== "string"){
      return;
    }

    uploadedLogoData =
      reader.result;

    if($("logoStatus")){
      $("logoStatus").textContent =
        "Uploaded logo ready.";
    }

    renderPreview();
    saveDraft();
  };

  reader.onerror = function(){

    uploadedLogoData = "";

    showStatus(
      "Unable to read the logo file.",
      "error"
    );
  };

  reader.readAsDataURL(file);
}

/* ============================================================
   RESET
============================================================ */

function resetBuilder(){

  const confirmed =
    window.confirm(
      "Reset the signature builder? All current information will be cleared."
    );

  if(!confirmed){
    return;
  }

  const fields = [
    "firstName",
    "lastName",
    "jobTitle",
    "company",
    "department",
    "email",
    "phone",
    "mobile",
    "website",
    "address",
    "logoUrl"
  ];

  fields.forEach(id => {
    if($(id)){
      $(id).value = "";
    }
  });

  if($("logoFile")){
    $("logoFile").value = "";
  }

  if($("mainDivider")){
    $("mainDivider").value = "none";
  }

  if($("socialDivider")){
    $("socialDivider").value = "none";
  }

  uploadedLogoData = "";

  socials = [
    {type:"LinkedIn",url:""},
    {type:"Instagram",url:""},
    {type:"Facebook",url:""},
    {type:"X",url:""}
  ];

  currentLayout = 1;

  try{
    localStorage.removeItem(STORAGE_KEY);
  }catch(e){}

  if($("logoStatus")){
    $("logoStatus").textContent = "";
  }

  if($("clientBox")){
    $("clientBox").classList.remove("visible");
  }

  if($("clientLink")){
    $("clientLink").value = "";
  }

  renderSocials();
  updateLayoutButtons();
  renderPreview();

  showStatus(
    "Builder reset.",
    "success"
  );
}

/* ============================================================
   EVENT BINDING
============================================================ */

function bindBuilderEvents(){

  const liveFields = [
    "firstName",
    "lastName",
    "jobTitle",
    "company",
    "department",
    "email",
    "phone",
    "mobile",
    "website",
    "address",
    "logoUrl",
    "mainDivider",
    "socialDivider"
  ];

  liveFields.forEach(id => {

    const field = $(id);

    if(!field){
      return;
    }

    field.addEventListener(
      "input",
      () => {
        renderPreview();
        saveDraft();
      }
    );

    field.addEventListener(
      "change",
      () => {
        renderPreview();
        saveDraft();
      }
    );
  });

  document
    .querySelectorAll("[data-layout]")
    .forEach(button => {

      button.addEventListener(
        "click",
        () => {
          setLayout(button.dataset.layout);
        }
      );
    });

  $("addSocialBtn")?.addEventListener(
    "click",
    addSocial
  );

  $("logoFile")?.addEventListener(
    "change",
    handleLogoUpload
  );

  $("resetBtn")?.addEventListener(
    "click",
    resetBuilder
  );

  $("copyBtn")?.addEventListener(
    "click",
    copySignature
  );

  $("previewCopyBtn")?.addEventListener(
    "click",
    copySignature
  );

  $("htmlBtn")?.addEventListener(
    "click",
    () => {

      const data = getBuilderData();

      if(isSignatureEmpty(data)){
        showStatus(
          "Add some information before viewing the HTML.",
          "error"
        );
        return;
      }

      openHTMLModal(
        generateSignature(data)
      );
    }
  );

  $("modalCopyBtn")?.addEventListener(
    "click",
    copyModalHTML
  );

  $("closeModalBtn")?.addEventListener(
    "click",
    closeHTMLModal
  );

  $("clientBtn")?.addEventListener(
    "click",
    createClientLink
  );

  $("htmlModal")?.addEventListener(
    "click",
    event => {
      if(event.target === $("htmlModal")){
        closeHTMLModal();
      }
    }
  );
}

/* ============================================================
   HASH ROUTING
============================================================ */

function boot(){

  const hash =
    window.location.hash || "";

  if(hash.startsWith("#client=")){

    const data =
      getClientDataFromHash();

    if(data){
      renderClientPage(data);
    }else{
      renderInvalidClientPage();
    }

    return;
  }

  renderBuilder();
}

window.addEventListener(
  "hashchange",
  () => {

    if(
      window.location.hash.startsWith("#client=")
    ){

      const data =
        getClientDataFromHash();

      if(data){
        renderClientPage(data);
      }else{
        renderInvalidClientPage();
      }

    }else{

      window.location.reload();

    }
  }
);

boot();
