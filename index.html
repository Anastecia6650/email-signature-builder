<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta name="description" content="Professional email signature builder with shareable client pages.">
<title>Email Signature Builder</title>

<style>
*{box-sizing:border-box}

:root{
  --bg:#f4f6f8;
  --card:#fff;
  --text:#101828;
  --muted:#667085;
  --border:#dfe3e8;
  --primary:#111827;
  --primary-hover:#27303f;
  --success:#067647;
  --danger:#b42318;
}

html,body{
  margin:0;
  padding:0;
  min-height:100%;
}

body{
  background:var(--bg);
  color:var(--text);
  font-family:Arial,Helvetica,sans-serif;
}

button,input,textarea,select{
  font:inherit;
}

button{
  cursor:pointer;
}

.app{
  min-height:100vh;
}

.topbar{
  position:sticky;
  top:0;
  z-index:50;
  background:#fff;
  border-bottom:1px solid var(--border);
  padding:15px 24px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:20px;
}

.brand{
  display:flex;
  align-items:center;
  gap:11px;
}

.brand-icon{
  width:40px;
  height:40px;
  border-radius:10px;
  display:flex;
  align-items:center;
  justify-content:center;
  background:#111827;
  color:#fff;
  font-weight:800;
}

.brand-title{
  font-weight:800;
  font-size:16px;
}

.brand-subtitle{
  font-size:11px;
  color:var(--muted);
  margin-top:2px;
}

.actions{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
}

.btn{
  border:0;
  border-radius:8px;
  padding:10px 14px;
  font-weight:700;
  font-size:13px;
}

.btn-primary{
  background:var(--primary);
  color:#fff;
}

.btn-primary:hover{
  background:var(--primary-hover);
}

.btn-secondary{
  background:#fff;
  color:#344054;
  border:1px solid #d0d5dd;
}

.btn-success{
  background:var(--success);
  color:#fff;
}

.btn-danger{
  background:#fee4e2;
  color:var(--danger);
}

.container{
  width:min(1450px,100%);
  margin:auto;
  padding:25px;
}

.builder-grid{
  display:grid;
  grid-template-columns:420px minmax(0,1fr);
  gap:22px;
  align-items:start;
}

.card{
  background:var(--card);
  border:1px solid var(--border);
  border-radius:15px;
  box-shadow:0 3px 16px rgba(16,24,40,.04);
}

.builder-card{
  position:sticky;
  top:80px;
  max-height:calc(100vh - 100px);
  overflow-y:auto;
}

.card-inner{
  padding:20px;
}

.section{
  margin-bottom:25px;
}

.section:last-child{
  margin-bottom:0;
}

.section-title{
  font-size:12px;
  font-weight:800;
  letter-spacing:.06em;
  text-transform:uppercase;
  margin-bottom:13px;
  color:#344054;
}

.field{
  margin-bottom:11px;
}

.field:last-child{
  margin-bottom:0;
}

label{
  display:block;
  font-size:12px;
  font-weight:700;
  margin-bottom:5px;
  color:#344054;
}

input,textarea,select{
  width:100%;
  padding:10px 11px;
  border:1px solid #d0d5dd;
  border-radius:8px;
  background:#fff;
  color:#101828;
  outline:none;
}

input:focus,
textarea:focus,
select:focus{
  border-color:#667085;
  box-shadow:0 0 0 3px rgba(17,24,39,.06);
}

textarea{
  min-height:75px;
  resize:vertical;
}

.two{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:9px;
}

.layout-tabs{
  display:grid;
  grid-template-columns:repeat(5,1fr);
  gap:6px;
}

.layout-tab{
  padding:9px 4px;
  border:1px solid #d0d5dd;
  background:#fff;
  color:#344054;
  border-radius:7px;
  font-size:11px;
  font-weight:700;
}

.layout-tab.active{
  background:#111827;
  border-color:#111827;
  color:#fff;
}

.social-item{
  display:grid;
  grid-template-columns:100px minmax(0,1fr) 34px;
  gap:6px;
  margin-bottom:7px;
}

.social-item button{
  padding:0;
}

.add-social{
  margin-top:3px;
}

.notice{
  background:#f2f4f7;
  border-radius:8px;
  padding:11px;
  color:#475467;
  font-size:11px;
  line-height:1.55;
}

.small-text{
  color:var(--muted);
  font-size:10px;
  line-height:1.5;
}

.client-box{
  display:none;
  margin-top:12px;
}

.client-box.visible{
  display:block;
}

.client-link{
  font-size:11px;
}

.status{
  min-height:17px;
  margin-top:6px;
  font-size:11px;
}

.status.success{
  color:var(--success);
}

.status.error{
  color:var(--danger);
}

.preview-card{
  min-width:0;
}

.preview-header{
  padding:16px 20px;
  border-bottom:1px solid var(--border);
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
}

.preview-header h2{
  margin:0;
  font-size:16px;
}

.preview-area{
  padding:40px;
  min-height:500px;
  background:#f8f9fa;
  overflow:auto;
}

.signature-paper{
  background:#fff;
  border:1px solid #e4e7ec;
  border-radius:9px;
  padding:35px;
  min-width:500px;
  box-shadow:0 8px 25px rgba(16,24,40,.05);
}

.instructions{
  margin-top:20px;
}

.instruction{
  border:1px solid var(--border);
  border-radius:10px;
  padding:14px;
  margin-bottom:9px;
}

.instruction:last-child{
  margin-bottom:0;
}

.instruction h3{
  margin:0 0 5px;
  font-size:13px;
}

.instruction p{
  margin:0;
  color:var(--muted);
  font-size:11px;
  line-height:1.55;
}

.modal{
  display:none;
  position:fixed;
  inset:0;
  z-index:100;
  background:rgba(16,24,40,.6);
  padding:20px;
  align-items:center;
  justify-content:center;
}

.modal.open{
  display:flex;
}

.modal-content{
  width:min(900px,100%);
  max-height:90vh;
  background:#fff;
  border-radius:14px;
  padding:20px;
  overflow:auto;
}

.modal-header{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-bottom:12px;
}

.modal-header h2{
  margin:0;
  font-size:17px;
}

.code-output{
  width:100%;
  min-height:380px;
  font-family:monospace;
  font-size:11px;
}

.client-page{
  min-height:100vh;
  background:#f4f6f8;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:25px;
}

.client-container{
  width:min(780px,100%);
  background:#fff;
  border:1px solid #dfe3e8;
  border-radius:18px;
  padding:30px;
  box-shadow:0 12px 45px rgba(16,24,40,.08);
}

.client-heading{
  margin-bottom:22px;
}

.client-heading h1{
  margin:0;
  font-size:23px;
}

.client-heading p{
  margin:7px 0 0;
  color:#667085;
  font-size:13px;
  line-height:1.5;
}

.client-signature{
  background:#fff;
  border:1px solid #e4e7ec;
  border-radius:10px;
  padding:28px;
  overflow:auto;
}

.client-buttons{
  display:flex;
  flex-wrap:wrap;
  gap:8px;
  margin-top:18px;
}

.client-instructions{
  border-top:1px solid #e4e7ec;
  margin-top:25px;
  padding-top:22px;
}

.client-instructions h3{
  font-size:14px;
  margin:0 0 5px;
}

.client-instructions p{
  color:#667085;
  font-size:11px;
  line-height:1.6;
  margin:0 0 17px;
}

.client-message{
  min-height:18px;
  font-size:11px;
  margin-top:7px;
  color:#067647;
}

.invalid-page{
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
  background:#f4f6f8;
}

.invalid-card{
  width:min(480px,100%);
  background:#fff;
  border:1px solid #dfe3e8;
  border-radius:16px;
  padding:30px;
  text-align:center;
}

.invalid-card h1{
  margin:0 0 8px;
  font-size:21px;
}

.invalid-card p{
  color:#667085;
  font-size:13px;
  line-height:1.6;
  margin:0;
}

@media(max-width:1000px){
  .builder-grid{
    grid-template-columns:1fr;
  }

  .builder-card{
    position:relative;
    top:auto;
    max-height:none;
  }
}

@media(max-width:650px){
  .topbar{
    padding:12px 15px;
  }

  .container{
    padding:12px;
  }

  .card-inner{
    padding:15px;
  }

  .two{
    grid-template-columns:1fr;
  }

  .layout-tabs{
    grid-template-columns:repeat(3,1fr);
  }

  .preview-area{
    padding:12px;
  }

  .signature-paper{
    min-width:500px;
    padding:20px;
  }

  .client-page{
    padding:12px;
  }

  .client-container{
    padding:20px;
  }
}
</style>
</head>

<body>

<div id="app"></div>

<script>
"use strict";

/* ============================================================
   APPLICATION STATE
============================================================ */

let currentLayout = 1;
let uploadedLogoData = "";

let socials = [
  {type:"LinkedIn",url:""},
  {type:"Instagram",url:""},
  {type:"Facebook",url:""},
  {type:"X",url:""}
];


/* ============================================================
   BASIC HELPERS
============================================================ */

function $(id){
  return document.getElementById(id);
}

function escapeHTML(value){
  return String(value ?? "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");
}

function normalizeUrl(value){
  value = String(value || "").trim();

  if(!value){
    return "";
  }

  if(/^javascript:/i.test(value)){
    return "";
  }

  if(/^https?:\/\//i.test(value)){
    return value;
  }

  return "https://" + value;
}

function telUrl(value){
  const clean = String(value || "")
    .replace(/[^\d+]/g,"");

  return clean ? "tel:" + clean : "";
}

function mailUrl(value){
  return value
    ? "mailto:" + encodeURIComponent(value)
    : "";
}


/* ============================================================
   GET BUILDER DATA
============================================================ */

function getBuilderData(){

  return {
    firstName:$("firstName")?.value.trim() || "",
    lastName:$("lastName")?.value.trim() || "",
    jobTitle:$("jobTitle")?.value.trim() || "",
    company:$("company")?.value.trim() || "",
    department:$("department")?.value.trim() || "",

    email:$("email")?.value.trim() || "",
    phone:$("phone")?.value.trim() || "",
    mobile:$("mobile")?.value.trim() || "",
    website:$("website")?.value.trim() || "",
    address:$("address")?.value.trim() || "",

    logoUrl:$("logoUrl")?.value.trim() || "",

    mainDivider:$("mainDivider")?.value || "none",
    socialDivider:$("socialDivider")?.value || "none",

    layout:currentLayout,

    socials:socials
      .filter(item => item.url.trim())
      .map(item => ({
        type:item.type,
        url:item.url.trim()
      }))
  };
}


/* ============================================================
   LOGO
============================================================ */

function getLogoSource(data){

  /*
    Public HTTPS logo URL is preferred because it works
    for everyone opening the client link.
  */

  if(data.logoUrl){
    return normalizeUrl(data.logoUrl);
  }

  /*
    Local uploaded logo is used for the builder preview and
    downloaded HTML.

    It is NOT placed inside shareable client URLs.
  */

  if(data.uploadedLogo){
    return data.uploadedLogo;
  }

  return "";
}

function logoHTML(data,style){

  const src = getLogoSource(data);

  if(!src){
    return "";
  }

  return `
<img
  src="${escapeHTML(src)}"
  alt="${escapeHTML(data.company || "Company logo")}"
  style="${style || "display:block;max-width:130px;max-height:80px;object-fit:contain;border:0;"}"
>
`;
}


/* ============================================================
   DIVIDER
============================================================ */

function divider(type){

  if(type !== "line"){
    return "";
  }

  return `
<tr>
<td colspan="2" style="padding:10px 0;">
<div style="
height:1px;
background:#d0d5dd;
font-size:1px;
line-height:1px;
">
&nbsp;
</div>
</td>
</tr>
`;
}


/* ============================================================
   CONTACT HTML
============================================================ */

function contactHTML(data){

  let html = "";

  if(data.email){
    html += `
<tr>
<td style="
font-family:Arial,Helvetica,sans-serif;
font-size:13px;
color:#475467;
padding:2px 0;
">
<strong>Email:</strong>
<a
href="${escapeHTML(mailUrl(data.email))}"
style="color:#344054;text-decoration:none;"
>
${escapeHTML(data.email)}
</a>
</td>
</tr>
`;
  }

  if(data.phone){
    html += `
<tr>
<td style="
font-family:Arial,Helvetica,sans-serif;
font-size:13px;
color:#475467;
padding:2px 0;
">
<strong>Phone:</strong>
<a
href="${escapeHTML(telUrl(data.phone))}"
style="color:#344054;text-decoration:none;"
>
${escapeHTML(data.phone)}
</a>
</td>
</tr>
`;
  }

  if(data.mobile){
    html += `
<tr>
<td style="
font-family:Arial,Helvetica,sans-serif;
font-size:13px;
color:#475467;
padding:2px 0;
">
<strong>Mobile:</strong>
<a
href="${escapeHTML(telUrl(data.mobile))}"
style="color:#344054;text-decoration:none;"
>
${escapeHTML(data.mobile)}
</a>
</td>
</tr>
`;
  }

  if(data.website){
    html += `
<tr>
<td style="
font-family:Arial,Helvetica,sans-serif;
font-size:13px;
color:#475467;
padding:2px 0;
">
<strong>Web:</strong>
<a
href="${escapeHTML(normalizeUrl(data.website))}"
style="color:#344054;text-decoration:none;"
>
${escapeHTML(data.website)}
</a>
</td>
</tr>
`;
  }

  if(data.address){
    html += `
<tr>
<td style="
font-family:Arial,Helvetica,sans-serif;
font-size:13px;
color:#667085;
padding:5px 0;
line-height:1.45;
">
${escapeHTML(data.address).replace(/\n/g,"<br>")}
</td>
</tr>
`;
  }

  return html;
}


/* ============================================================
   SOCIAL HTML
============================================================ */

const socialIcons = {
  LinkedIn:"in",
  Instagram:"ig",
  Facebook:"f",
  X:"𝕏",
  YouTube:"▶",
  TikTok:"♪",
  WhatsApp:"wa",
  Website:"↗"
};

function socialHTML(data){

  if(!data.socials.length){
    return "";
  }

  return `
<table cellpadding="0" cellspacing="0" border="0" style="border-collapse:collapse;">
<tr>
${data.socials.map(item => {

  const url = normalizeUrl(item.url);

  return `
<td style="padding-right:8px;">
<a
href="${escapeHTML(url)}"
style="
display:inline-block;
font-family:Arial,Helvetica,sans-serif;
font-size:11px;
font-weight:700;
color:#344054;
text-decoration:none;
border:1px solid #d0d5dd;
border-radius:4px;
padding:4px 6px;
"
>
${escapeHTML(socialIcons[item.type] || item.type)}
&nbsp;${escapeHTML(item.type)}
</a>
</td>
`;

}).join("")}
</tr>
</table>
`;
}


/* ============================================================
   SIGNATURE GENERATOR
============================================================ */

function generateSignature(data){

  const name =
    `${data.firstName} ${data.lastName}`.trim()
    || "Your Name";

  const title =
    data.jobTitle || "Job Title";

  const company =
    data.company || "";

  const department =
    data.department
      ? `
<div style="
font-family:Arial,Helvetica,sans-serif;
font-size:12px;
color:#667085;
margin-top:3px;
">
${escapeHTML(data.department)}
</div>
`
      : "";

  const logo =
    logoHTML(
      data,
      "display:block;max-width:125px;max-height:80px;object-fit:contain;border:0;"
    );

  const mainDivider =
    divider(data.mainDivider);

  const socialDivider =
    divider(data.socialDivider);

  const socials =
    socialHTML(data);

  /* ----------------------------------------------------------
     LAYOUT 1
  ---------------------------------------------------------- */

  if(data.layout === 1){

    return `
<table cellpadding="0" cellspacing="0" border="0"
style="border-collapse:collapse;">

<tr>

<td style="
vertical-align:top;
padding-right:20px;
">
${logo}
</td>

<td style="
vertical-align:top;
border-left:1px solid #d0d5dd;
padding-left:20px;
">

<div style="
font-family:Arial,Helvetica,sans-serif;
font-size:19px;
font-weight:700;
color:#111827;
">
${escapeHTML(name)}
</div>

<div style="
font-family:Arial,Helvetica,sans-serif;
font-size:13px;
color:#475467;
margin-top:4px;
">
${escapeHTML(title)}
${company ? " · " + escapeHTML(company) : ""}
</div>

${department}

<table cellpadding="0" cellspacing="0" border="0"
style="border-collapse:collapse;">
${mainDivider}
${contactHTML(data)}
${socialDivider}
<tr>
<td>
${socials}
</td>
</tr>
</table>

</td>

</tr>

</table>
`;
  }


  /* ----------------------------------------------------------
     LAYOUT 2
  ---------------------------------------------------------- */

  if(data.layout === 2){

    return `
<table cellpadding="0" cellspacing="0" border="0"
style="border-collapse:collapse;">

<tr>

<td style="
vertical-align:top;
padding-right:22px;
">

<div style="
font-family:Arial,Helvetica,sans-serif;
font-size:21px;
font-weight:700;
color:#111827;
">
${escapeHTML(name)}
</div>

<div style="
font-family:Arial,Helvetica,sans-serif;
font-size:13px;
color:#475467;
margin-top:4px;
">
${escapeHTML(title)}
${company ? " | " + escapeHTML(company) : ""}
</div>

${department}

<table cellpadding="0" cellspacing="0" border="0"
style="border-collapse:collapse;">
${mainDivider}
${contactHTML(data)}
${socialDivider}
<tr><td>${socials}</td></tr>
</table>

</td>

<td style="
vertical-align:middle;
padding-left:22px;
">
${logo}
</td>

</tr>

</table>
`;
  }


  /* ----------------------------------------------------------
     LAYOUT 3
  ---------------------------------------------------------- */

  if(data.layout === 3){

    return `
<table cellpadding="0" cellspacing="0" border="0"
style="border-collapse:collapse;">

<tr>
<td style="padding-bottom:12px;">
${logo}
</td>
</tr>

<tr>
<td>

<div style="
font-family:Arial,Helvetica,sans-serif;
font-size:20px;
font-weight:700;
color:#111827;
">
${escapeHTML(name)}
</div>

<div style="
font-family:Arial,Helvetica,sans-serif;
font-size:13px;
color:#475467;
margin-top:4px;
">
${escapeHTML(title)}
${company ? " · " + escapeHTML(company) : ""}
</div>

${department}

<table cellpadding="0" cellspacing="0" border="0"
style="border-collapse:collapse;">
${mainDivider}
${contactHTML(data)}
${socialDivider}
<tr><td>${socials}</td></tr>
</table>

</td>
</tr>

</table>
`;
  }


  /* ----------------------------------------------------------
     LAYOUT 4
  ---------------------------------------------------------- */

  if(data.layout === 4){

    return `
<table cellpadding="0" cellspacing="0" border="0"
style="border-collapse:collapse;">

<tr>

<td style="
vertical-align:middle;
width:125px;
padding-right:20px;
">
${logo}
</td>

<td style="vertical-align:middle;">

<div style="
font-family:Arial,Helvetica,sans-serif;
font-size:18px;
font-weight:700;
color:#111827;
">
${escapeHTML(name)}
</div>

<div style="
font-family:Arial,Helvetica,sans-serif;
font-size:13px;
color:#475467;
margin-top:4px;
">
${escapeHTML(title)}
</div>

${company ? `
<div style="
font-family:Arial,Helvetica,sans-serif;
font-size:12px;
color:#667085;
margin-top:3px;
">
${escapeHTML(company)}
</div>
` : ""}

${department}

</td>

</tr>

<tr>
<td colspan="2">

<table cellpadding="0" cellspacing="0" border="0"
style="border-collapse:collapse;">
${mainDivider}
${contactHTML(data)}
${socialDivider}
<tr><td>${socials}</td></tr>
</table>

</td>
</tr>

</table>
`;
  }


  /* ----------------------------------------------------------
     LAYOUT 5
  ---------------------------------------------------------- */

  return `
<table cellpadding="0" cellspacing="0" border="0"
style="
border-collapse:collapse;
background:#f8fafc;
">

<tr>

<td style="
vertical-align:top;
padding:18px;
">
${logo}
</td>

<td style="
vertical-align:top;
padding:18px 18px 18px 0;
">

<div style="
font-family:Arial,Helvetica,sans-serif;
font-size:19px;
font-weight:700;
color:#111827;
">
${escapeHTML(name)}
</div>

<div style="
font-family:Arial,Helvetica,sans-serif;
font-size:13px;
color:#475467;
margin-top:4px;

async function copySignature(){

  const data =
    getBuilderData();

  data.uploadedLogo =
    uploadedLogoData;

  const html =
    generateSignature(data);

  const text =
    $("preview")
      ? $("preview").innerText
      : "";


  try{

    /*
      Modern rich clipboard.
    */

    if(
      navigator.clipboard &&
      window.ClipboardItem
    ){

      const htmlBlob =
        new Blob(
          [html],
          {type:"text/html"}
        );

      const textBlob =
        new Blob(
          [text],
          {type:"text/plain"}
        );

      const item =
        new ClipboardItem({
          "text/html":htmlBlob,
          "text/plain":textBlob
        });

      await navigator.clipboard.write([item]);

    }else{

      /*
        Browser fallback.
      */

      const temp =
        document.createElement("div");

      temp.innerHTML = html;

      temp.style.position = "fixed";
      temp.style.left = "-99999px";

      document.body.appendChild(temp);

      const range =
        document.createRange();

      range.selectNodeContents(temp);

      const selection =
        window.getSelection();

      selection.removeAllRanges();
      selection.addRange(range);

      document.execCommand("copy");

      selection.removeAllRanges();

      temp.remove();

    }

    showStatus(
      "Signature copied successfully.",
      true
    );

  }catch(error){

    console.error(error);

    showStatus(
      "Copy failed. Use View HTML and copy the code.",
      false
    );

  }
}

/* ============================================================
   CLIENT LINK ENCODING
============================================================ */

/*
  IMPORTANT:

  We use:

  https://domain.com/index.html#client=DATA

  instead of:

  https://domain.com/index.html?client=DATA

  GitHub Pages serves index.html normally and the browser
  handles everything after #.

  We also intentionally do NOT include a local uploaded
  base64 image in the share URL.
*/


function encodeClientData(data){

  /*
    Only store the data needed to reproduce the signature.
  */

  const cleanData = {

    firstName:data.firstName || "",
    lastName:data.lastName || "",
    jobTitle:data.jobTitle || "",
    company:data.company || "",
    department:data.department || "",

    email:data.email || "",
    phone:data.phone || "",
    mobile:data.mobile || "",
    website:data.website || "",
    address:data.address || "",

    logoUrl:data.logoUrl || "",

    mainDivider:data.mainDivider || "none",
    socialDivider:data.socialDivider || "none",

    layout:Number(data.layout || 1),

    socials:Array.isArray(data.socials)
      ? data.socials.map(item=>({
          type:String(item.type || ""),
          url:String(item.url || "")
        }))
      : []

  };


  const json =
    JSON.stringify(cleanData);


  /*
    UTF-8 → binary → Base64.
  */

  const bytes =
    new TextEncoder().encode(json);

  let binary = "";

  for(
    let i = 0;
    i < bytes.length;
    i++
  ){

    binary +=
      String.fromCharCode(bytes[i]);

  }

  const base64 =
    btoa(binary);


  /*
    URL encode the Base64 string.

    This protects against special characters.
  */

  return encodeURIComponent(base64);
}


function decodeClientData(encoded){

  try{

    if(!encoded){
      return null;
    }


    const base64 =
      decodeURIComponent(encoded);


    const binary =
      atob(base64);


    const bytes =
      new Uint8Array(binary.length);


    for(
      let i = 0;
      i < binary.length;
      i++
    ){

      bytes[i] =
        binary.charCodeAt(i);

    }


    const json =
      new TextDecoder()
        .decode(bytes);


    const data =
      JSON.parse(json);


    /*
      Normalize missing values.
    */

    return {

      firstName:data.firstName || "",
      lastName:data.lastName || "",
      jobTitle:data.jobTitle || "",
      company:data.company || "",
      department:data.department || "",

      email:data.email || "",
      phone:data.phone || "",
      mobile:data.mobile || "",
      website:data.website || "",
      address:data.address || "",

      logoUrl:data.logoUrl || "",

      mainDivider:
        data.mainDivider || "none",

      socialDivider:
        data.socialDivider || "none",

      layout:
        Number(data.layout || 1),

      socials:
        Array.isArray(data.socials)
          ? data.socials
          : [],

      uploadedLogo:""

    };

  }catch(error){

    console.error(
      "CLIENT LINK ERROR:",
      error
    );

    return null;
  }
}


/* ============================================================
   BUILD CLIENT URL
============================================================ */

function getBaseApplicationUrl(){

  /*
    window.location.href may already contain an old hash.

    We remove:
    - query string
    - old hash

    and preserve the GitHub Pages folder.
  */

  const url =
    new URL(
      window.location.href
    );

  url.search = "";
  url.hash = "";

  /*
    Ensure there is a path.

    Example:
    /signature-builder/
  */

  return url.toString();
}


function createClientPage(){

  const data =
    getBuilderData();


  /*
    A local uploaded image is intentionally excluded from
    the client URL.

    Public logo URL is required for the client to see the
    same logo on another device.
  */

  if(
    uploadedLogoData &&
    !data.logoUrl
  ){

    const proceed =
      confirm(
        "You uploaded a logo, but you did not provide a public Logo URL.\n\n" +
        "The uploaded image cannot reliably be placed inside a shareable GitHub Pages link.\n\n" +
        "The client link will be created without that uploaded image.\n\n" +
        "Use a public HTTPS logo URL if the client must see the logo."
      );

    if(!proceed){
      return;
    }

  }


  const encoded =
    encodeClientData(data);


  const base =
    getBaseApplicationUrl();


  /*
    THIS is the important part.

    The client data is after #client=.

    Example:

    https://example.github.io/signature/#client=ABC...
  */

  const clientUrl =
    base +
    "#client=" +
    encoded;


  $("clientLink").value =
    clientUrl;


  $("clientBox")
    .classList
    .add("visible");


  showStatus(
    "Client link created successfully.",
    true
  );


  return clientUrl;
}

          generateSignature(data);

        const plain =
          $("clientSignature")
            .innerText;


        const message =
          $("clientMessage");


        try{

          if(
            navigator.clipboard &&
            window.ClipboardItem
          ){

            const htmlBlob =
              new Blob(
                [html],
                {type:"text/html"}
              );

            const textBlob =
              new Blob(
                [plain],
                {type:"text/plain"}
              );

            const item =
              new ClipboardItem({
                "text/html":htmlBlob,
                "text/plain":textBlob
              });

            await navigator.clipboard
              .write([item]);

          }else{

            const temp =
              document.createElement("div");

            temp.innerHTML = html;

            temp.style.position =
              "fixed";

            temp.style.left =
              "-99999px";

            document.body.appendChild(temp);


            const range =
              document.createRange();

            range.selectNodeContents(temp);


            const selection =
              window.getSelection();

            selection.removeAllRanges();

            selection.addRange(range);


            document.execCommand(
              "copy"
            );


            selection.removeAllRanges();

            temp.remove();

          }


          message.textContent =
            "Signature copied successfully.";

          message.style.color =
            "#067647";


        }catch(error){

          console.error(error);

          message.textContent =
            "Copy failed. Please select the signature manually.";

          message.style.color =
            "#b42318";

        }

      }
    );


  /*
    CLIENT DOWNLOAD
  */

  $("clientDownloadSignature")
    .addEventListener(
      "click",
      function(){

        const signature =
          generateSignature(data);


        const fullHTML =
`<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Email Signature</title>
</head>
<body>
${signature}
</body>
</html>`;


        const blob =
          new Blob(
            [fullHTML],
            {
              type:
                "text/html;charset=utf-8"
            }
          );


        const url =
          URL.createObjectURL(blob);


        const a =
          document.createElement("a");

        a.href = url;

        a.download =
          "email-signature.html";


        document.body.appendChild(a);

        a.click();

        a.remove();


        setTimeout(()=>{
          URL.revokeObjectURL(url);
        },1000);

      }
    );
}


/* ============================================================
   INVALID CLIENT PAGE
============================================================ */

function renderInvalidClientPage(){

  document.title =
    "Invalid Client Link";


  document.body.innerHTML = `

<div class="invalid-page">

<div class="invalid-card">

<h1>
Invalid Client Link
</h1>

<p>
This client link is invalid, incomplete, or corrupted.
Please return to the signature builder and create a new
client link.
</p>

</div>

</div>

`;

}


/* ============================================================
   DETECT CLIENT PAGE
============================================================ */

function tryLoadClientPage(){

  /*
    Read ONLY the hash.

    Example:

    #client=ENCODED_DATA
  */

  const hash =
    window.location.hash;


  if(
    !hash ||
    !hash.startsWith("#client=")
  ){

    return false;

  }


  const encoded =
    hash.substring(
      "#client=".length
    );


  if(!encoded){

    renderInvalidClientPage();

    return true;

  }


  const data =
    decodeClientData(encoded);


  if(!data){

    renderInvalidClientPage();

    return true;

  }


  renderClientPage(data);

  return true;
}


/* ============================================================
   APPLICATION START
============================================================ */

(function(){

  /*
    If the URL contains #client=...
    show ONLY the client page.

    Otherwise show the builder.
  */

  if(
    !tryLoadClientPage()
  ){

    renderBuilder();

  }

})();
</script>
