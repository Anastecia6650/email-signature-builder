<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta name="description" content="Professional email signature builder with shareable client pages.">
<meta name="theme-color" content="#111827">
<title>Email Signature Builder</title> 

<style>
*{
  box-sizing:border-box;
}

:root{
  --bg:#f4f6f8;
  --card:#fff;
  --text:#101828;
  --muted:#667085;
  --border:#dfe3e8;
  --primary:#111827;
  --primary-hover:#27303f;
  --success:#067647;
  --danger:#b42318;
  --danger-bg:#fee4e2;
}

html,
body{
  margin:0;
  padding:0;
  min-height:100%;
}

body{
  background:var(--bg);
  color:var(--text);
  font-family:Arial,Helvetica,sans-serif;
}

button,
input,
textarea,
select{
  font:inherit;
}

button{
  cursor:pointer;
}

button:disabled{
  cursor:not-allowed;
  opacity:.6;
}

a{
  color:inherit;
}

.app{
  min-height:100vh;
}

/* ============================================================
   TOP BAR
============================================================ */

.topbar{
  position:sticky;
  top:0;
  z-index:50;
  background:#fff;
  border-bottom:1px solid var(--border);
  padding:15px 24px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:20px;
}

.brand{
  display:flex;
  align-items:center;
  gap:11px;
}

.brand-icon{
  width:40px;
  height:40px;
  border-radius:10px;
  display:flex;
  align-items:center;
  justify-content:center;
  background:#111827;
  color:#fff;
  font-weight:800;
}

.brand-title{
  font-weight:800;
  font-size:16px;
}

.brand-subtitle{
  font-size:11px;
  color:var(--muted);
  margin-top:2px;
}

.actions{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
}

/* ============================================================
   BUTTONS
============================================================ */

.btn{
  border:0;
  border-radius:8px;
  padding:10px 14px;
  font-weight:700;
  font-size:13px;
  transition:
    background .15s ease,
    border-color .15s ease,
    transform .05s ease;
}

.btn:active{
  transform:translateY(1px);
}

.btn-primary{
  background:var(--primary);
  color:#fff;
}

.btn-primary:hover{
  background:var(--primary-hover);
}

.btn-secondary{
  background:#fff;
  color:#344054;
  border:1px solid #d0d5dd;
}

.btn-secondary:hover{
  background:#f9fafb;
}

.btn-success{
  background:var(--success);
  color:#fff;
}

.btn-danger{
  background:var(--danger-bg);
  color:var(--danger);
}

/* ============================================================
   BUILDER
============================================================ */

.container{
  width:min(1450px,100%);
  margin:auto;
  padding:25px;
}

.builder-grid{
  display:grid;
  grid-template-columns:420px minmax(0,1fr);
  gap:22px;
  align-items:start;
}

.card{
  background:var(--card);
  border:1px solid var(--border);
  border-radius:15px;
  box-shadow:0 3px 16px rgba(16,24,40,.04);
}

.builder-card{
  position:sticky;
  top:80px;
  max-height:calc(100vh - 100px);
  overflow-y:auto;
}

.card-inner{
  padding:20px;
}

.section{
  margin-bottom:25px;
}

.section:last-child{
  margin-bottom:0;
}

.section-title{
  font-size:12px;
  font-weight:800;
  letter-spacing:.06em;
  text-transform:uppercase;
  margin-bottom:13px;
  color:#344054;
}

.field{
  margin-bottom:11px;
}

.field:last-child{
  margin-bottom:0;
}

label{
  display:block;
  font-size:12px;
  font-weight:700;
  margin-bottom:5px;
  color:#344054;
}

input,
textarea,
select{
  width:100%;
  padding:10px 11px;
  border:1px solid #d0d5dd;
  border-radius:8px;
  background:#fff;
  color:#101828;
  outline:none;
}

input:focus,
textarea:focus,
select:focus{
  border-color:#667085;
  box-shadow:0 0 0 3px rgba(17,24,39,.06);
}

textarea{
  min-height:75px;
  resize:vertical;
}

.two{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:9px;
}

/* ============================================================
   LAYOUT TABS
============================================================ */

.layout-tabs{
  display:grid;
  grid-template-columns:repeat(5,1fr);
  gap:6px;
}

.layout-tab{
  padding:9px 4px;
  border:1px solid #d0d5dd;
  background:#fff;
  color:#344054;
  border-radius:7px;
  font-size:11px;
  font-weight:700;
}

.layout-tab:hover{
  background:#f9fafb;
}

.layout-tab.active{
  background:#111827;
  border-color:#111827;
  color:#fff;
}

/* ============================================================
   SOCIAL EDITOR
============================================================ */

.social-item{
  display:grid;
  grid-template-columns:100px minmax(0,1fr) 34px;
  gap:6px;
  margin-bottom:7px;
}

.social-item button{
  padding:0;
}

.add-social{
  margin-top:3px;
}

/* ============================================================
   NOTICES / STATUS
============================================================ */

.notice{
  background:#f2f4f7;
  border-radius:8px;
  padding:11px;
  color:#475467;
  font-size:11px;
  line-height:1.55;
}

.small-text{
  color:var(--muted);
  font-size:10px;
  line-height:1.5;
}

.client-box{
  display:none;
  margin-top:12px;
}

.client-box.visible{
  display:block;
}

.client-link{
  font-size:11px;
}

.status{
  min-height:17px;
  margin-top:6px;
  font-size:11px;
}

.status.success{
  color:var(--success);
}

.status.error{
  color:var(--danger);
}

/* ============================================================
   PREVIEW
============================================================ */

.preview-card{
  min-width:0;
}

.preview-header{
  padding:16px 20px;
  border-bottom:1px solid var(--border);
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
}

.preview-header h2{
  margin:0;
  font-size:16px;
}

.preview-area{
  padding:40px;
  min-height:500px;
  background:#f8f9fa;
  overflow:auto;
}

.signature-paper{
  background:#fff;
  border:1px solid #e4e7ec;
  border-radius:9px;
  padding:35px;
  min-width:500px;
  box-shadow:0 8px 25px rgba(16,24,40,.05);
}

/* ============================================================
   INSTRUCTIONS
============================================================ */

.instructions{
  margin-top:20px;
}

.instruction{
  border:1px solid var(--border);
  border-radius:10px;
  padding:14px;
  margin-bottom:9px;
}

.instruction:last-child{
  margin-bottom:0;
}

.instruction h3{
  margin:0 0 5px;
  font-size:13px;
}

.instruction p{
  margin:0;
  color:var(--muted);
  font-size:11px;
  line-height:1.55;
}

/* ============================================================
   MODAL
============================================================ */

.modal{
  display:none;
  position:fixed;
  inset:0;
  z-index:100;
  background:rgba(16,24,40,.6);
  padding:20px;
  align-items:center;
  justify-content:center;
}

.modal.open{
  display:flex;
}

.modal-content{
  width:min(900px,100%);
  max-height:90vh;
  background:#fff;
  border-radius:14px;
  padding:20px;
  overflow:auto;
}

.modal-header{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-bottom:12px;
}

.modal-header h2{
  margin:0;
  font-size:17px;
}

.code-output{
  width:100%;
  min-height:380px;
  font-family:monospace;
  font-size:11px;
  line-height:1.5;
}

/* ============================================================
   CLIENT PAGE
============================================================ */

.client-page{
  min-height:100vh;
  background:#f4f6f8;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:25px;
}

.client-container{
  width:min(780px,100%);
  background:#fff;
  border:1px solid #dfe3e8;
  border-radius:18px;
  padding:30px;
  box-shadow:0 12px 45px rgba(16,24,40,.08);
}

.client-heading{
  margin-bottom:22px;
}

.client-heading h1{
  margin:0;
  font-size:23px;
}

.client-heading p{
  margin:7px 0 0;
  color:#667085;
  font-size:13px;
  line-height:1.5;
}

.client-signature{
  background:#fff;
  border:1px solid #e4e7ec;
  border-radius:10px;
  padding:28px;
  overflow:auto;
}

.client-buttons{
  display:flex;
  flex-wrap:wrap;
  gap:8px;
  margin-top:18px;
}

.client-instructions{
  border-top:1px solid #e4e7ec;
  margin-top:25px;
  padding-top:22px;
}

.client-instructions h3{
  font-size:14px;
  margin:0 0 5px;
}

.client-instructions p{
  color:#667085;
  font-size:11px;
  line-height:1.6;
  margin:0 0 17px;
}

.client-message{
  min-height:18px;
  font-size:11px;
  margin-top:7px;
}

/* ============================================================
   INVALID PAGE
============================================================ */

.invalid-page{
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
  background:#f4f6f8;
}

.invalid-card{
  width:min(480px,100%);
  background:#fff;
  border:1px solid #dfe3e8;
  border-radius:16px;
  padding:30px;
  text-align:center;
}

.invalid-card h1{
  margin:0 0 8px;
  font-size:21px;
}

.invalid-card p{
  color:#667085;
  font-size:13px;
  line-height:1.6;
  margin:0;
}

/* ============================================================
   EMPTY PREVIEW
============================================================ */

.empty-preview{
  display:flex;
  align-items:center;
  justify-content:center;
  min-height:250px;
  color:#98a2b3;
  font-size:13px;
  text-align:center;
}

/* ============================================================
   RESPONSIVE
============================================================ */

@media(max-width:1000px){

  .builder-grid{
    grid-template-columns:1fr;
  }

  .builder-card{
    position:relative;
    top:auto;
    max-height:none;
  }
}

@media(max-width:650px){

  .topbar{
    padding:12px 15px;
    align-items:flex-start;
    flex-direction:column;
  }

  .container{
    padding:12px;
  }

  .card-inner{
    padding:15px;
  }

  .two{
    grid-template-columns:1fr;
  }

  .layout-tabs{
    grid-template-columns:repeat(3,1fr);
  }

  .preview-area{
    padding:12px;
  }

  .signature-paper{
    min-width:500px;
    padding:20px;
  }

  .client-page{
    padding:12px;
  }

  .client-container{
    padding:20px;
  }

  .client-signature{
    padding:18px;
  }
}
</style>
</head>

<body>

<div id="app"></div>

<script>
"use strict";

/* ============================================================
   APPLICATION STATE
============================================================ */

let currentLayout = 1;
let uploadedLogoData = "";

let socials = [
  {type:"LinkedIn",url:""},
  {type:"Instagram",url:""},
  {type:"Facebook",url:""},
  {type:"X",url:""}
];

/* ============================================================
   BASIC HELPERS
============================================================ */

function $(id){
  return document.getElementById(id);
}

function escapeHTML(value){
  return String(value ?? "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");
}

/*
  Only allow normal web URLs.
  This prevents javascript:, data:, vbscript:, etc.
*/
function normalizeUrl(value){

  value = String(value || "").trim();

  if(!value){
    return "";
  }

  if(/^javascript:/i.test(value)){
    return "";
  }

  if(/^vbscript:/i.test(value)){
    return "";
  }

  if(/^data:/i.test(value)){
    return "";
  }

  if(/^mailto:/i.test(value)){
    return value;
  }

  if(/^https?:\/\//i.test(value)){
    return value;
  }

  return "https://" + value;
}

function safeHttpUrl(value){

  const url = normalizeUrl(value);

  if(!url){
    return "";
  }

  try{

    const parsed = new URL(url);

    if(
      parsed.protocol !== "http:" &&
      parsed.protocol !== "https:"
    ){
      return "";
    }

    return parsed.href;

  }catch(error){

    return "";

  }
}

function telUrl(value){

  const clean = String(value || "")
    .replace(/[^\d+]/g,"");

  return clean
    ? "tel:" + clean
    : "";
}

function mailUrl(value){

  const email =
    String(value || "").trim();

  if(!email){
    return "";
  }

  return "mailto:" +
    encodeURIComponent(email);
}

function whatsappUrl(value){

  let phone =
    String(value || "")
      .replace(/[^\d]/g,"");

  if(!phone){
    return "";
  }

  return "https://wa.me/" + phone;
}

function isValidEmail(value){

  if(!value){
    return false;
  }

  return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(
    value
  );
}

/* ============================================================
   GET BUILDER DATA
============================================================ */

function getBuilderData(){

  return {

    firstName:
      $("firstName")?.value.trim() || "",

    lastName:
      $("lastName")?.value.trim() || "",

    jobTitle:
      $("jobTitle")?.value.trim() || "",

    company:
      $("company")?.value.trim() || "",

    department:
      $("department")?.value.trim() || "",

    email:
      $("email")?.value.trim() || "",

    phone:
      $("phone")?.value.trim() || "",

    mobile:
      $("mobile")?.value.trim() || "",

    website:
      $("website")?.value.trim() || "",

    address:
      $("address")?.value.trim() || "",

    logoUrl:
      $("logoUrl")?.value.trim() || "",

    mainDivider:
      $("mainDivider")?.value || "none",

    socialDivider:
      $("socialDivider")?.value || "none",

    layout:
      currentLayout,

    socials:
      socials
        .filter(item => item.url.trim())
        .map(item => ({
          type:item.type,
          url:item.url.trim()
        }))
  };
}

/* ============================================================
   LOGO
============================================================ */

function getLogoSource(data){

  if(data.logoUrl){

    const publicUrl =
      safeHttpUrl(data.logoUrl);

    if(publicUrl){
      return publicUrl;
    }
  }

  if(data.uploadedLogo){
    return data.uploadedLogo;
  }

  return "";
}

function logoHTML(data,style){

  const src =
    getLogoSource(data);

  if(!src){
    return "";
  }

  return `
<img
  src="${escapeHTML(src)}"
  alt="${escapeHTML(data.company || "Company logo")}"
  style="${style || "display:block;max-width:130px;max-height:80px;object-fit:contain;border:0;"}"
>
`;
}

/* ============================================================
   DIVIDER
============================================================ */

function divider(type){

  if(type !== "line"){
    return "";
  }

  return `
<tr>
<td colspan="2" style="padding:10px 0;">
<div style="
height:1px;
background:#d0d5dd;
font-size:1px;
line-height:1px;
">
&nbsp;
</div>
</td>
</tr>
`;
}

/* ============================================================
   CONTACT ICONS
============================================================ */

const contactIcons = {

  email: `
<svg xmlns="http://www.w3.org/2000/svg"
width="16" height="16" viewBox="0 0 24 24"
fill="none" stroke="currentColor"
stroke-width="2"
stroke-linecap="round"
stroke-linejoin="round">

  phone: `

`,

  mobile: `
<svg xmlns="http://www.w3.org/2000/svg"
width="16" height="16" viewBox="0 0 24 24"
fill="none" stroke="currentColor"
stroke-width="2"
stroke-linecap="round"

<rect x="5" y="2" width="14" height="20" rx="2"/>
<line x1="12" y1="18" x2="12.01" y2="18"/>
</svg>
`,

  website: `
<svg xmlns="http://www.w3.org/2000/svg"
width="16" height="16" viewBox="0 0 24 24"
fill="none" stroke="currentColor"
stroke-width="2"
stroke-linecap="round"
stroke-linejoin="round">
<circle cx="12" cy="12" r="10"/>
<line x1="2" y1="12" x2="22" y2="12"/>
<path d="M12 2a15.3 15.3 0 0 1 0 20"/>
<path d="M12 2a15.3 15.3 0 0 0 0 20"/>
</svg>
`
};

/* ============================================================
   CONTACT HTML
============================================================ */

function contactHTML(data){

  let html = "";

  const iconBox = `
display:inline-flex;
align-items:center;
justify-content:center;
width:30px;
height:30px;
border:1px solid #d0d5dd;
border-radius:6px;
color:#344054;
vertical-align:middle;
`;

  if(data.email){

    const emailLink =
      mailUrl(data.email);

    if(emailLink){

      html += `
<tr>
<td style="padding:3px 7px 3px 0;">
<a
href="${escapeHTML(emailLink)}"
title="${escapeHTML(data.email)}"
style="text-decoration:none;color:#344054;"
>
<span style="${iconBox}">
${contactIcons.email}
</span>
</a>
</td>
</tr>
`;
    }
  }

  if(data.phone){

    const phoneLink =
      telUrl(data.phone);

    if(phoneLink){

      html += `
<tr>
<td style="padding:3px 7px 3px 0;">
<a
href="${escapeHTML(phoneLink)}"
title="${escapeHTML(data.phone)}"
style="text-decoration:none;color:#344054;"
>
<span style="${iconBox}">
${contactIcons.phone}
</span>
</a>
</td>
</tr>
`;
    }
  }

  if(data.mobile){

    const mobileLink =
      telUrl(data.mobile);

    if(mobileLink){

      html += `
<tr>
<td style="padding:3px 7px 3px 0;">
<a
href="${escapeHTML(mobileLink)}"
title="${escapeHTML(data.mobile)}"
style="text-decoration:none;color:#344054;"
>
<span style="${iconBox}">
${contactIcons.mobile}
</span>
</a>
</td>
</tr>
`;
    }
  }

  if(data.website){

    const websiteLink =
      safeHttpUrl(data.website);

    if(websiteLink){

      html += `
<tr>
<td style="padding:3px 7px 3px 0;">
<a
href="${escapeHTML(websiteLink)}"
title="${escapeHTML(data.website)}"
target="_blank"
rel="noopener noreferrer"
style="text-decoration:none;color:#344054;"
>
<span style="${iconBox}">
${contactIcons.website}
</span>
</a>
</td>
</tr>
`;
    }
  }

  if(data.address){

    html += `
<tr>
<td style="
font-family:Arial,Helvetica,sans-serif;
font-size:13px;
color:#667085;
padding:5px 0;
line-height:1.45;
">
${escapeHTML(data.address)
  .replace(/\r?\n/g,"<br>")}
</td>
</tr>
`;
  }

  return html;
}
