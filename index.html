<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="Professional email signature builder and client signature page">
<title>Email Signature Builder</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  padding:20px;
  background:#f3f4f6;
  font-family:Arial,Helvetica,sans-serif;
  font-size:14px;
  color:#111827;
}

.wrap{
  max-width:1100px;
  margin:auto;
}

.box,
.client-card{
  background:#fff;
  padding:25px;
  border-radius:14px;
  box-shadow:0 4px 20px #0001;
}

.grid{
  display:grid;
  grid-template-columns:370px 1fr;
  gap:20px;
}

h1{
  margin-top:0;
}

h2,
h3{
  margin-top:0;
}

label{
  display:block;
  font-size:12px;
  font-weight:bold;
  margin:12px 0 5px;
}

input,
select{
  width:100%;
  padding:10px;
  border:1px solid #d1d5db;
  border-radius:7px;
  background:#fff;
  font-family:inherit;
}

input[type="color"]{
  height:42px;
  padding:3px;
}

input[type="file"]{
  padding:7px;
}

input[type="range"]{
  padding:0;
}

button{
  cursor:pointer;
  font-family:inherit;
}

.primary{
  width:100%;
  padding:13px;
  border:0;
  border-radius:7px;
  background:#2563eb;
  color:#fff;
  font-weight:bold;
  margin-top:15px;
}

.primary:hover{
  background:#1d4ed8;
}

.preview{
  background:#fff;
  border:1px solid #ddd;
  border-radius:9px;
  padding:35px;
  min-height:220px;
  overflow:auto;
}

.actions{
  display:flex;
  gap:8px;
}

.actions button{
  flex:1;
  padding:11px;
  border:0;
  border-radius:7px;
  background:#111827;
  color:#fff;
  margin-top:10px;
}

.layouts{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:7px;
}

.layout{
  padding:10px;
  border:1px solid #ccc;
  background:#fff;
  border-radius:7px;
}

.layout.active{
  background:#eff6ff;
  border:2px solid #2563eb;
  color:#1d4ed8;
}

.logo-box{
  border:2px dashed #d1d5db;
  border-radius:8px;
  padding:15px;
  text-align:center;
  margin-top:8px;
}

.logo-preview{
  max-width:220px;
  max-height:120px;
  display:none;
  margin:12px auto;
}

.divider{
  height:1px;
  background:#e5e7eb;
  margin:20px 0;
}

.msg{
  display:none;
  text-align:center;
  color:#047857;
  margin-top:10px;
  line-height:1.5;
}

.linkbox{
  display:none;
  background:#eff6ff;
  padding:15px;
  border-radius:8px;
  margin-top:15px;
}

.client{
  display:none;
}

.client-wrap{
  max-width:800px;
  margin:30px auto;
}

.client-sig{
  border:1px solid #ddd;
  border-radius:9px;
  padding:30px;
  overflow:auto;
  background:#fff;
}

.tabs{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:7px;
  margin-top:15px;
}

.tab{
  padding:11px;
  border:1px solid #ccc;
  background:#fff;
  border-radius:7px;
  font-weight:bold;
}

.tab.active{
  background:#111827;
  color:#fff;
}

.guide{
  background:#f9fafb;
  border:1px solid #ddd;
  padding:18px;
  border-radius:8px;
  margin-top:10px;
}

.guide li{
  margin-bottom:10px;
  line-height:1.45;
}

.tip{
  background:#eff6ff;
  color:#1e40af;
  padding:12px;
  border-radius:7px;
  margin-top:15px;
}

.client-logo-area{
  border:1px solid #ddd;
  padding:15px;
  border-radius:8px;
  margin:15px 0;
  background:#fafafa;
}

.client-logo-preview{
  max-width:220px;
  max-height:120px;
  display:none;
  margin:12px auto;
}

.small{
  font-size:12px;
  color:#6b7280;
  line-height:1.5;
}

.notice{
  background:#fff7ed;
  border:1px solid #fed7aa;
  color:#9a3412;
  padding:12px;
  border-radius:8px;
  margin-top:12px;
  line-height:1.5;
}

.error{
  max-width:650px;
  margin:60px auto;
  padding:30px;
  background:#fff;
  border-radius:14px;
  box-shadow:0 4px 20px #0001;
  text-align:center;
}

.error h2{
  color:#b91c1c;
}

.client-header{
  text-align:center;
  margin-bottom:20px;
}

.client-header h2{
  margin-bottom:5px;
}

.social-divider-preview{
  height:1px;
  margin:10px 0;
}

@media(max-width:800px){

  body{
    padding:10px;
  }

  .grid{
    grid-template-columns:1fr;
  }

  .actions{
    flex-direction:column;
  }

  .tabs{
    grid-template-columns:1fr;
  }

  .preview{
    padding:20px;
  }
}
</style>
</head>

<body>

     BUILDER
========================================================= -->

<div id="builder" class="wrap">

  <h1>Email Signature Builder</h1>

  <p class="small">
    Create a professional email signature and generate a client page link.
  </p>

  <div class="grid">

    <!-- LEFT: FORM -->
    <div class="box">

      <h3>Client Information</h3>

      <label for="name">Full Name</label>
      <input id="name" placeholder="John Ade">

      <label for="title">Job Title</label>
      <input id="title" placeholder="Managing Director">

      <label for="company">Company</label>
      <input id="company" placeholder="ABC Consulting Ltd">

      <label for="phone">Phone</label>
      <input id="phone" placeholder="+234 800 123 4567">

      <label for="email">Email</label>
      <input id="email" placeholder="john@abc.com">

      <label for="website">Website</label>
      <input id="website" placeholder="https://abc.com">

      <label for="location">Location</label>
      <input id="location" placeholder="Lagos, Nigeria">


      <div class="divider"></div>

      <h3>Social Links</h3>

      <label for="whatsapp">WhatsApp</label>
      <input id="whatsapp" placeholder="https://wa.me/2348001234567">

      <label for="linkedin">LinkedIn</label>
      <input id="linkedin" placeholder="https://linkedin.com/in/username">

      <label for="instagram">Instagram</label>
      <input id="instagram" placeholder="https://instagram.com/username">

      <label for="facebook">Facebook</label>
      <input id="facebook" placeholder="https://facebook.com/username">

      <label for="tiktok">TikTok</label>
      <input id="tiktok" placeholder="https://tiktok.com/@username">

      <label for="twitter">X / Twitter</label>
      <input id="twitter" placeholder="https://x.com/username">


      <div class="divider"></div>

      <h3>Company Logo</h3>

      <p class="small">
        For the shortest client link, use a public logo URL.
        Uploaded logos are compressed but may make the client link longer.
      </p>

      <label for="builderLogo">Upload Logo</label>
      <input
        type="file"
        id="builderLogo"
        accept="image/png,image/jpeg,image/webp"
      >

      <img
        id="builderLogoPreview"
        class="logo-preview"
        alt="Logo preview"
      >

      <label for="builderLogoUrl">
        OR Logo URL <strong>(Recommended)</strong>
      </label>

      <input
        id="builderLogoUrl"
        placeholder="https://example.com/logo.png"
      >

      <label for="logoWidth">Logo Width</label>

      <input
        type="range"
        id="logoWidth"
        min="60"
        max="250"
        value="140"
      >

      <p class="small">
        Logo size:
        <strong>
          <span id="logoSize">140</span>px
